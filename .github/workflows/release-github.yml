name: Release — GitHub Release (direct downloads)

# Manual-trigger workflow: builds Android/macOS/Linux with production signing
# and publishes a versioned GitHub Release (direct downloads). Replaces the
# old moving "latest" prerelease. Store uploads live in their own workflows:
# release-play / release-testflight / release-appgallery / release-mac-appstore.

on:
  workflow_dispatch:

concurrency:
  group: release-github
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.6

defaults:
  run:
    working-directory: app

jobs:
  prepare:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Read version & validate release notes
        id: meta
        run: |
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          DIR="release_notes/$VERSION"
          if [ ! -f "$DIR/ar.md" ]; then
            echo "::error::Missing $DIR/ar.md — write the release notes before running this workflow"
            exit 1
          fi
          echo "Releasing $VERSION — notes: $(ls "$DIR" | tr '\n' ' ')"

      - name: Validate required secrets
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          HUAWEI_KEYSTORE_BASE64: ${{ secrets.HUAWEI_KEYSTORE_BASE64 }}
          HUAWEI_KEYSTORE_PASSWORD: ${{ secrets.HUAWEI_KEYSTORE_PASSWORD }}
          HUAWEI_KEY_ALIAS: ${{ secrets.HUAWEI_KEY_ALIAS }}
          HUAWEI_KEY_PASSWORD: ${{ secrets.HUAWEI_KEY_PASSWORD }}
          MAC_DEV_ID_P12_BASE64: ${{ secrets.MAC_DEV_ID_P12_BASE64 }}
          MAC_DEV_ID_P12_PASSWORD: ${{ secrets.MAC_DEV_ID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          miss=0
          need() { if [ -z "${!1}" ]; then echo "::error::Missing GitHub secret: $1"; miss=1; fi; }
          need MAPTILER_KEY
          need HUAWEI_KEYSTORE_BASE64
          need HUAWEI_KEYSTORE_PASSWORD
          need HUAWEI_KEY_ALIAS
          need HUAWEI_KEY_PASSWORD
          need MAC_DEV_ID_P12_BASE64
          need MAC_DEV_ID_P12_PASSWORD
          need ASC_KEY_ID
          need ASC_ISSUER_ID
          need ASC_KEY_P8_BASE64
          [ "$miss" -eq 1 ] && exit 1
          echo "All required secrets are present"

  build-android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - name: Checkout floatica (path dependency ../floatica)
        uses: actions/checkout@v4
        with:
          repository: alheekmahlib/floatica
          path: floatica
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - name: Generate api_keys.dart from secrets
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          cat > lib/core/utils/constants/api_keys.dart <<EOF
          // AUTO-GENERATED in CI from secrets - do not edit.
          class ApiKeys {
            ApiKeys._();
            static const String mapTilerKey = '$MAPTILER_KEY';
            static const String mapTilerUserAgent = 'Aqim-app';
          }
          EOF
      - name: Restore Huawei signing keystore
        env:
          HUAWEI_KEYSTORE_BASE64: ${{ secrets.HUAWEI_KEYSTORE_BASE64 }}
          HUAWEI_KEYSTORE_PASSWORD: ${{ secrets.HUAWEI_KEYSTORE_PASSWORD }}
          HUAWEI_KEY_ALIAS: ${{ secrets.HUAWEI_KEY_ALIAS }}
          HUAWEI_KEY_PASSWORD: ${{ secrets.HUAWEI_KEY_PASSWORD }}
        run: |
          if ! printf '%s' "$HUAWEI_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 --decode > android/app/huawei-release.jks 2>/dev/null; then
            echo "::error::HUAWEI_KEYSTORE_BASE64 is not valid base64 — recreate the secret (base64 -i huawei-release-key.keystore)"
            exit 1
          fi
          { echo "storePassword=$HUAWEI_KEYSTORE_PASSWORD"
            echo "keyPassword=$HUAWEI_KEY_PASSWORD"
            echo "keyAlias=$HUAWEI_KEY_ALIAS"
            echo "storeFile=huawei-release.jks"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Stage APK
        run: cp build/app/outputs/flutter-apk/app-release.apk aqim-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: app/aqim-android.apk

  build-macos:
    name: Build macOS (Developer ID + notarized)
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - name: Checkout floatica (path dependency ../floatica)
        uses: actions/checkout@v4
        with:
          repository: alheekmahlib/floatica
          path: floatica
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - name: Import Developer ID certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MAC_DEV_ID_P12_BASE64 }}
          p12-password: ${{ secrets.MAC_DEV_ID_P12_PASSWORD }}
      - name: Generate api_keys.dart from secrets
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          cat > lib/core/utils/constants/api_keys.dart <<EOF
          // AUTO-GENERATED in CI from secrets - do not edit.
          class ApiKeys {
            ApiKeys._();
            static const String mapTilerKey = '$MAPTILER_KEY';
            static const String mapTilerUserAgent = 'Aqim-app';
          }
          EOF
      - run: flutter pub get
      - name: Patch project for unsigned (ad-hoc) build
        run: |
          python3 - <<'PY'
          import re
          path = "macos/Runner.xcodeproj/project.pbxproj"
          src = open(path).read()
          src = src.replace("ProvisioningStyle = Automatic;", "ProvisioningStyle = Manual;")
          # Quoted keys like "CODE_SIGN_IDENTITY[sdk=macosx*]" must be stripped too —
          # they override the ad-hoc identity and make Xcode demand a provisioning profile.
          # Unlike iOS, the macOS Runner bundle id comes from AppInfo.xcconfig, so blocks
          # are matched on any signing key, not only PRODUCT_BUNDLE_IDENTIFIER.
          strip = re.compile(r'^\t*"?(CODE_SIGN_STYLE|PROVISIONING_PROFILE(_SPECIFIER)?|CODE_SIGN_IDENTITY(\[[^\]]*\])?|DEVELOPMENT_TEAM(\[[^\]]*\])?)"?\s*=.*?;\n', re.M)
          blocks = re.compile(r'(buildSettings = \{)(.*?)(\n\t\t\t\};)', re.S)
          patched = 0
          def patch(m):
              global patched
              body = m.group(2)
              if not re.search(r'PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE|DEVELOPMENT_TEAM', body):
                  return m.group(0)
              patched += 1
              body = strip.sub('', body)
              inj = ('\n\t\t\t\tCODE_SIGN_STYLE = Manual;'
                     '\n\t\t\t\tCODE_SIGN_IDENTITY = "-";')
              return m.group(1) + body + inj + m.group(3)
          open(path, 'w').write(blocks.sub(patch, src))
          if patched == 0:
              print("::error::pbxproj patcher matched no buildSettings blocks — project layout changed")
              raise SystemExit(1)
          print(f"macOS project patched for ad-hoc signing ({patched} blocks)")
          PY
      - name: Strip profile-bound entitlement for direct distribution
        # aps-environment (APNs push) only exists via provisioning profiles;
        # Developer ID builds cannot carry it. Currently absent in this app —
        # the delete is a guarded no-op that protects future edits.
        run: /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.aps-environment" macos/Runner/Release.entitlements 2>/dev/null || echo "no aps key present"
      - run: flutter build macos --release
      - name: Sign with Developer ID Application
        run: |
          set -euo pipefail
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No .app bundle under build/macos/Build/Products/Release:"
            ls -R build/macos/Build/Products 2>/dev/null | head -40
            exit 1
          fi
          echo "App bundle: $APP"
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed -E 's/^.*"(.*)".*$/\1/' || true)
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in keychain. Identities available:"
            security find-identity -v -p codesigning || true
            exit 1
          fi
          echo "Signing with: $IDENTITY"
          # Sign deepest-first: nested dylibs/frameworks before their containers
          find "$APP" -type f -name "*.dylib" | awk -F/ '{print NF, $0}' | sort -rn | cut -d' ' -f2- \
            | while IFS= read -r f; do codesign --force --options runtime --timestamp --sign "$IDENTITY" "$f"; done
          find "$APP" -type d -name "*.framework" | awk -F/ '{print NF, $0}' | sort -rn | cut -d' ' -f2- \
            | while IFS= read -r f; do codesign --force --options runtime --timestamp --sign "$IDENTITY" "$f"; done
          find "$APP" -type d -name "*.appex" \
            | while IFS= read -r f; do codesign --force --options runtime --timestamp --sign "$IDENTITY" --entitlements macos/prayer_widget/prayer_widget.entitlements "$f"; done
          codesign --force --options runtime --timestamp --sign "$IDENTITY" --entitlements macos/Runner/Release.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Notarize & staple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No .app bundle under build/macos/Build/Products/Release:"
            ls -R build/macos/Build/Products 2>/dev/null | head -40
            exit 1
          fi
          echo "App bundle: $APP"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple "$APP"
          ditto -c -k --keepParent "$APP" aqim-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: app/aqim-macos-arm64.zip

  build-linux:
    name: Build Linux
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - name: Checkout floatica (path dependency ../floatica)
        uses: actions/checkout@v4
        with:
          repository: alheekmahlib/floatica
          path: floatica
      - name: Install GTK build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - name: Generate api_keys.dart from secrets
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          cat > lib/core/utils/constants/api_keys.dart <<EOF
          // AUTO-GENERATED in CI from secrets - do not edit.
          class ApiKeys {
            ApiKeys._();
            static const String mapTilerKey = '$MAPTILER_KEY';
            static const String mapTilerUserAgent = 'Aqim-app';
          }
          EOF
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package tar.gz
        run: tar -czf aqim-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: app/aqim-linux-x64.tar.gz

  github-release:
    name: Publish GitHub Release
    needs: [prepare, build-android, build-macos, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
          merge-multiple: true
      - name: Compose release notes (ar + en)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            cat "release_notes/$VERSION/ar.md"
            if [ -f "release_notes/$VERSION/en.md" ]; then
              printf '\n---\n\n'
              cat "release_notes/$VERSION/en.md"
            fi
          } > body.md
      - name: Create versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          TAG="v$VERSION"
          # Allow re-runs for the same version: replace any existing release/tag
          gh release view "$TAG" && gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file body.md \
            --latest \
            ../dist/aqim-android.apk \
            ../dist/aqim-macos-arm64.zip \
            ../dist/aqim-linux-x64.tar.gz
          echo "Published GitHub Release $TAG."
