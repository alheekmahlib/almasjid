name: Release — App Store (TestFlight)

# Manual-trigger workflow: builds a signed IPA and uploads it to TestFlight.
# Submitting the App Store version for review (with localized what's-new)
# stays manual in App Store Connect.

on:
  workflow_dispatch:

concurrency:
  group: release-testflight
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.6
  APPLE_TEAM_ID: Y9R8TJ3LS7

defaults:
  run:
    working-directory: app

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - name: Checkout floatica (path dependency ../floatica)
        uses: actions/checkout@v4
        with:
          repository: alheekmahlib/floatica
          path: floatica
      - name: Validate required secrets
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_PROFILE_WIDGET_BASE64: ${{ secrets.IOS_PROFILE_WIDGET_BASE64 }}
        run: |
          miss=0
          need() { if [ -z "${!1}" ]; then echo "::error::Missing GitHub secret: $1"; miss=1; fi; }
          need MAPTILER_KEY
          need IOS_P12_BASE64
          need IOS_P12_PASSWORD
          need IOS_PROFILE_BASE64
          need IOS_PROFILE_WIDGET_BASE64
          [ "$miss" -eq 1 ] && exit 1
          echo "All required secrets are present"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - name: Import distribution certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}
      - name: Install provisioning profiles (app + widget)
        env:
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_PROFILE_WIDGET_BASE64: ${{ secrets.IOS_PROFILE_WIDGET_BASE64 }}
        run: |
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          # tr strips paste artifacts (newlines/spaces); decode errors name the broken secret
          if ! printf '%s' "$IOS_PROFILE_BASE64" | tr -d ' \r\n\t' | base64 --decode > "$PROFILES/app.mobileprovision" 2>/dev/null; then
            echo "::error::IOS_PROFILE_BASE64 is not valid base64 — recreate the secret (App Store profile for com.alheekmah.aqimApp)"
            exit 1
          fi
          if ! printf '%s' "$IOS_PROFILE_WIDGET_BASE64" | tr -d ' \r\n\t' | base64 --decode > "$PROFILES/widget.mobileprovision" 2>/dev/null; then
            echo "::error::IOS_PROFILE_WIDGET_BASE64 is not valid base64 — recreate the secret (App Store profile for com.alheekmah.aqimApp.prayerWidget)"
            exit 1
          fi
      - name: Generate api_keys.dart from secrets
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          cat > lib/core/utils/constants/api_keys.dart <<EOF
          // AUTO-GENERATED in CI from secrets - do not edit.
          class ApiKeys {
            ApiKeys._();
            static const String mapTilerKey = '$MAPTILER_KEY';
            static const String mapTilerUserAgent = 'Aqim-app';
          }
          EOF
      - name: Generate ExportOptions.plist from installed profiles
        id: uuids
        run: |
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID_APP=$(security cms -D -i "$PROFILES/app.mobileprovision" | plutil -extract UUID raw -o - -)
          UUID_WIDGET=$(security cms -D -i "$PROFILES/widget.mobileprovision" | plutil -extract UUID raw -o - -)
          if [ -z "$UUID_APP" ] || [ -z "$UUID_WIDGET" ]; then
            echo "::error::Could not read profile UUIDs — are the secrets valid .mobileprovision files?"
            exit 1
          fi
          {
            echo "uuid_app=$UUID_APP"
            echo "uuid_widget=$UUID_WIDGET"
          } >> "$GITHUB_OUTPUT"
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.alheekmah.aqimApp</key>
              <string>$UUID_APP</string>
              <key>com.alheekmah.aqimApp.prayerWidget</key>
              <string>$UUID_WIDGET</string>
            </dict>
          </dict>
          </plist>
          EOF
      - name: Patch project to manual signing (app + widget)
        run: |
          python3 - "$UUID_APP" "$UUID_WIDGET" <<'PY'
          import re, sys
          uuid_app, uuid_widget = sys.argv[1], sys.argv[2]
          path = "ios/Runner.xcodeproj/project.pbxproj"
          src = open(path).read()
          src = src.replace("ProvisioningStyle = Automatic;", "ProvisioningStyle = Manual;")
          # sdk-scoped identities live in PROJECT-level blocks here (no bundle id,
          # so the block patcher below cannot reach them) — they override the
          # target-level injection and make Xcode demand a provisioning profile
          src = re.sub(r'^\t*"CODE_SIGN_IDENTITY\[[^]]*\]"\s*=\s*"[^"]*";\n', '', src, flags=re.M)
          # signing keys stripped per matched block, then re-injected with manual values
          strip = re.compile(r'^\t*"?(CODE_SIGN_STYLE|PROVISIONING_PROFILE(_SPECIFIER)?|CODE_SIGN_IDENTITY(\[[^\]]*\])?|DEVELOPMENT_TEAM(\[[^\]]*\])?)"?\s*=.*?;\n', re.M)
          blocks = re.compile(r'(buildSettings = \{)(.*?)(\n\t\t\t\};)', re.S)
          APP = "com.alheekmah.aqimApp"
          WIDGET = "com.alheekmah.aqimApp.prayerWidget"
          patched = 0
          def patch(m):
              global patched
              body = m.group(2)
              bid = re.search(r'PRODUCT_BUNDLE_IDENTIFIER = ("[^"]+"|[^;]+);', body)
              if not bid:
                  return m.group(0)
              bid = bid.group(1).strip().strip('"')
              if bid == APP:
                  uuid = uuid_app
              elif bid == WIDGET:
                  uuid = uuid_widget
              else:
                  return m.group(0)
              patched += 1
              body = strip.sub('', body)
              inj = ('\n\t\t\t\tCODE_SIGN_STYLE = Manual;'
                     '\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";'
                     '\n\t\t\t\tDEVELOPMENT_TEAM = Y9R8TJ3LS7;'
                     f'\n\t\t\t\tPROVISIONING_PROFILE = "{uuid}";')
              return m.group(1) + body + inj + m.group(3)
          open(path, 'w').write(blocks.sub(patch, src))
          if patched == 0:
              print("::error::pbxproj patcher matched no Runner/widget blocks — project layout changed")
              raise SystemExit(1)
          print(f"iOS project patched to manual signing ({patched} blocks)")
          PY
        env:
          UUID_APP: ${{ steps.uuids.outputs.uuid_app }}
          UUID_WIDGET: ${{ steps.uuids.outputs.uuid_widget }}
      - name: Sync iOS widget Info.plist versions with pubspec
        # The widget plist versions are maintained by hand (e.g. 1.2.16 / 23);
        # App Store rejects builds whose extension version diverges from the app
        run: |
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')
          NAME="${VERSION%%+*}"
          BUILD="${VERSION##*+}"
          PLIST=ios/prayer_widgetExtension/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NAME" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          echo "Widget plist synced to $NAME ($BUILD)"
      - run: flutter pub get
      - run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          if-no-files-found: error
          path: app/build/ios/ipa/*.ipa

  upload-testflight:
    name: Upload to TestFlight
    needs: build-ios
    # macOS runner: fastlane's binary upload needs Apple's iTMSTransporter,
    # which is unavailable on Linux (fails with an empty-dir chdir error)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios
          path: dist
          merge-multiple: true
      - name: Install fastlane
        # no checkout in this job — the global app/ working-directory does not exist here
        working-directory: .
        run: sudo gem install fastlane --no-document
      - name: Write App Store Connect API key
        working-directory: .
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          jq -n --arg key_id "$ASC_KEY_ID" --arg issuer_id "$ASC_ISSUER_ID" \
            --rawfile key "$RUNNER_TEMP/AuthKey.p8" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key}' > "$RUNNER_TEMP/asc.json"
      - name: Upload IPA to TestFlight
        working-directory: .
        run: |
          fastlane pilot upload \
            --api_key_path "$RUNNER_TEMP/asc.json" \
            --ipa dist/*.ipa \
            --skip_waiting_for_build_processing
          echo "IPA delivered to TestFlight — submit the App Store version manually after review."
